<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icono de la pestana del navegador (favicon).
      Se generó recortando la "Z" del logo del proyecto:
        - favicon.ico -> varios tamanos en un archivo, para navegadores antiguos
        - favicon.png -> version grande y nitida para pantallas retina
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Bootstrap 5: sistema de rejilla y componentes base (dropdown, botones, cards) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Font Awesome: iconos (corazon de favoritos, flechas, lupa...) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--
      Tipografias del proyecto (estilo "poster de periodico japones"):
        - Anton        -> titulares grandes y condensados
        - Oswald       -> subtitulos y etiquetas en mayusculas
        - Noto Serif JP-> texto corrido y kanji decorativos
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Ball Z</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Bundle JS de Bootstrap: necesario para que funcione el dropdown de favoritos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
